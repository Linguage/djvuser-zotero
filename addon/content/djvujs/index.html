<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" content="#000000">
    <link rel="shortcut icon" href="./djvu.png">
    <title>DjVu Viewer</title>
    <style>

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /*writing-mode: vertical-lr;*/
        }

        body {
            margin: 0;
            padding: 0;
            display: flex; /* in order to prevent child's margin:auto collapse (become) parent's margins */
            font-family: sans-serif;
            background: repeating-linear-gradient(135deg, #5aa0fa, #ffffff 50%);
        }

        #root, #root2 {
            box-sizing: border-box;
            width: 80%;
            padding: 2px;
            height: 90%;
            margin: 5vh auto;
            box-shadow: 0 0 1px gray;
            background: #b0c093;
            /*writing-mode: horizontal-tb;*/
        }

        /* used to check that such "default" styles are overridden for the viewer */
        :where(#root) *, :where(#root) ::before, :where(#root) ::after {
            background: red;
            padding: 100em;
            margin: 100em;
            border: 100px solid red;
            display: block;
            position: absolute;
        }

    </style>
    <script id="djvu_js_lib" src="djvu.js"></script>
    <script type="module" crossorigin src="./djvu_viewer.js"></script>
    <script>
        (function () {
            // 读取 ?url= 参数，自动加载 DjVu 文档
            const params = new URLSearchParams(window.location.search);
            const url = params.get('url');
            if (!url) return;

            function initViewer() {
                try {
                    if (!window.DjVu || !window.DjVu.Viewer) {
                        // djvu_viewer.js 还没初始化好，稍后再试
                        setTimeout(initViewer, 50);
                        return;
                    }

                    const viewer = new window.DjVu.Viewer();
                    viewer.render(document.getElementById('root'));
                    viewer.loadDocumentByUrl(url);
                } catch (e) {
                    console && console.error && console.error('DjVu autoload error', e);
                }
            }

            // 等页面和脚本都准备好后再尝试创建 viewer
            window.addEventListener('load', initViewer);
        })();
    </script>
</head>

<body>
    <noscript>
        You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
</body>

</html>
